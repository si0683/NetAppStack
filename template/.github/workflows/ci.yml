# Проверка на каждый push и pull request: сборка и тесты
name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build StarterApp.slnx -c Release
      - run: dotnet test --solution StarterApp.slnx -c Release --no-build
